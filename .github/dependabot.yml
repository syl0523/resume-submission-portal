version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns: ["wrangler", "miniflare", "@cloudflare/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router", "@tanstack/*"]
      tooling:
        patterns:
          [
            "typescript",
            "vite",
            "vitest",
            "@vitejs/*",
            "@biomejs/*",
            "esbuild",
            "tailwindcss",
            "@tailwindcss/*",
          ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
